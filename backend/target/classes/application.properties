# Application Configurations
spring.application.name=shms-backend
server.port=8080

# Database Configuration (MySQL Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console remains enabled for backup utility if needed
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ----------------- JWT Properties -----------------
shms.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e5f8c6b3d2e1a7f4e3c2b1a5d6e8f9c0b1a2d3e4f5a6b7c8d9e}
# Token validity: 24 hours (in milliseconds)
shms.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Jackson config for date-time format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Enable file upload size configs
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Debug Spring Security
logging.level.org.springframework.security=DEBUG
