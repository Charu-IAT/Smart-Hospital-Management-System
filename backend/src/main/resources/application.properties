# Application Configurations
spring.application.name=shms-backend
server.port=8080

# Profile configuration (default is H2 in-memory, set to mysql to use local mysql)
spring.profiles.active=h2

# ----------------- H2 Profile (Default) -----------------
%h2.spring.datasource.url=jdbc:h2:mem:shmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
%h2.spring.datasource.driverClassName=org.h2.Driver
%h2.spring.datasource.username=sa
%h2.spring.datasource.password=password
%h2.spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
%h2.spring.h2.console.enabled=true
%h2.spring.h2.console.path=/h2-console
%h2.spring.h2.console.settings.web-allow-others=true
%h2.spring.jpa.hibernate.ddl-auto=update
%h2.spring.jpa.show-sql=true

# ----------------- MySQL Profile -----------------
%mysql.spring.datasource.url=jdbc:mysql://localhost:3306/smart_hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
%mysql.spring.datasource.username=root
%mysql.spring.datasource.password=root
%mysql.spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
%mysql.spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
%mysql.spring.jpa.hibernate.ddl-auto=update
%mysql.spring.jpa.show-sql=false

# ----------------- JWT Properties -----------------
shms.jwt.secret=9a4f2c8d3b7a1e5f8c6b3d2e1a7f4e3c2b1a5d6e8f9c0b1a2d3e4f5a6b7c8d9e
# Token validity: 24 hours (in milliseconds)
shms.jwt.expirationMs=86400000

# Jackson config for date-time format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Enable file upload size configs
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
